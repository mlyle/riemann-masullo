name: Full build

# Builds every default target of the Lake package (`lake build`), from scratch. That includes
# RiemannMasulloClassField, which proves the class field theory input of Remark 7.1.3.1 from
# Naganori Yamaguchi's library (the `Nyll` dependency): about 1,200 modules of that library are
# compiled here, roughly an hour on a runner, on top of this project's own library.
#
# The other workflows (Main state, PR check, Lean Action CI) build the main library and the
# comparator files only, so that no pull request has to wait for the dependency. This one checks
# the rest: every week, on demand, and for a pull request that changes that library or the
# files that pin the dependencies.
on:
  schedule:
    - cron: "43 11 * * 0"
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'RiemannMasulloClassField/**'
      - 'lakefile.toml'
      - 'lake-manifest.json'
      - 'lean-toolchain'

permissions:
  contents: read

concurrency:
  group: full-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Lint
        run: scripts/lint.sh
      - name: Install Lean
        run: |
          curl -sSfL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >>"$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Fetch the dependencies and Mathlib's build
        run: lake exe cache get || { sleep 20; lake exe cache get; }
      - name: Build everything
        run: lake build
