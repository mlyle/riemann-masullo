name: Claims

# A comment whose first line starts with "Claiming" (or "Claimed") labels the issue `claimed` and
# assigns it to the commenter; "Releasing" (or "Released") by the holder or a project member undoes
# that. This lets people without write access claim issues.

#
# Once an hour, claims on proof issues that are more than eight hours old and that no open pull
# request refers to are released (scripts/ci/stale_claims.py), so that an issue does not sit idle
# behind a claim nobody is working on. The holder can claim it again.
#
# CLAIMS_CLOSE below, when set, is the time (UTC, ISO 8601) from which new claims are paused
# while the open pull requests are worked off (#6674). A "Claiming" comment made after it gets
# a reply and nothing else, and idle claims are not released meanwhile, since nobody could take
# the issue over. Releasing by hand still works. Set it to "" to accept claims again.

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read

env:
  CLAIMS_CLOSE: "2026-11-23T14:10:00Z"
  CLAIMS_NOTICE: "https://github.com/mccorvie/riemann-masullo/issues/6674"

jobs:
  release-stale:
    if: ${{ github.event_name != 'issue_comment' }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: scripts/ci
      - run: |
          if [ -n "$CLAIMS_CLOSE" ] && [ "$(date -u +%s)" -ge "$(date -u -d "$CLAIMS_CLOSE" +%s)" ]; then
            echo "claims paused since $CLAIMS_CLOSE: idle claims are not released"; exit 0
          fi
          python3 scripts/ci/stale_claims.py --apply

  claim:
    # Only a comment that claims or releases needs a runner. Every other issue comment used to start
    # this job too, and waited for a runner with everything else (#6797). `startsWith` ignores
    # case; the step below still checks the exact form of the first line.
    if: ${{ github.event_name == 'issue_comment' && !github.event.issue.pull_request && (startsWith(github.event.comment.body, 'claim') || startsWith(github.event.comment.body, 'releas')) }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE: ${{ github.event.issue.number }}
      WHO: ${{ github.event.comment.user.login }}
      ASSOC: ${{ github.event.comment.author_association }}
      BODY: ${{ github.event.comment.body }}
      COMMENT_AT: ${{ github.event.comment.created_at }}
      LABELS: ${{ join(github.event.issue.labels.*.name, ' ') }}
      ASSIGNEES: ${{ join(github.event.issue.assignees.*.login, ' ') }}
    steps:
      - name: Apply the claim or release
        run: |
          first=$(printf '%s' "$BODY" | head -n 1 | tr '[:upper:]' '[:lower:]')
          claimed=0; [[ " $LABELS " == *" claimed "* ]] && claimed=1
          mine=0; [[ " $ASSIGNEES " == *" $WHO "* ]] && mine=1
          member=0; [[ "$ASSOC" =~ ^(OWNER|MEMBER|COLLABORATOR)$ ]] && member=1
          # The time of the COMMENT decides, not the time this job runs: the job can wait a long
          # time for a runner (on 23 November, more than half an hour).
          closed=0
          if [ -n "$CLAIMS_CLOSE" ] && [ "$(date -u -d "${COMMENT_AT:-now}" +%s)" -ge "$(date -u -d "$CLAIMS_CLOSE" +%s)" ]; then closed=1; fi
          if [[ "$first" =~ ^claim(ing|ed)?([^a-z]|$) ]]; then
            if [ $closed = 1 ] && [ $mine = 0 ]; then
              gh issue comment "$ISSUE" --body "New claims are paused since $CLAIMS_CLOSE while the open pull requests are checked and merged, so this claim was not recorded. Claims will reopen when the backlog is cleared; please claim it again then. Details: $CLAIMS_NOTICE"
            elif [ $claimed = 0 ]; then
              gh issue edit "$ISSUE" --add-label claimed --add-assignee "$WHO"
            elif [ $mine = 0 ] && [ $member = 0 ]; then
              gh issue comment "$ISSUE" --body "This issue is already claimed${ASSIGNEES:+ by \`$ASSIGNEES\`}. Please pick another, or wait until it is released."
            fi
          elif [[ "$first" =~ ^releas(e|ed|ing)([^a-z]|$) ]]; then
            if [ $mine = 1 ] || [ $member = 1 ]; then
              gh issue edit "$ISSUE" --remove-label claimed
              [ -z "$ASSIGNEES" ] || gh issue edit "$ISSUE" --remove-assignee "${ASSIGNEES// /,}"
            fi
          fi
