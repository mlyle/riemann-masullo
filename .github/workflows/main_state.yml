name: Main state

# Builds main and saves what pull request checks start from: the signature of every declaration
# (scripts/signatures.sh) and the build directory. `PR check` downloads them instead of building
# main again; without them it builds main itself and reaches the same verdict, only later.
#
# It runs on every push to main, and Auto-merge starts it after merging, because a merge made
# with the workflow token does not count as a push. Only runs on main upload `main-state`;
# scripts/ci/base_state.py refuses an artifact of that name from anywhere else.
#
# The build is incremental (#3783): it starts from the previous saved build of main, so that only
# what changed is compiled and the saved state stays within a few merges of main. Lake trusts a
# compiled module whenever its recorded inputs match, so damage to a saved build would be carried
# forward. Three things bound that: a build from scratch every night, a build from scratch
# whenever the toolchain, the dependencies or the build options change, and the `full` switch of
# a manual run. Outputs of modules whose source is gone are deleted (scripts/ci/prune_build.py).

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 10 * * *"       # nightly, from scratch
  workflow_dispatch:
    inputs:
      full:
        description: Build from scratch instead of from the previous saved build
        type: boolean
        default: false

permissions:
  contents: read
  actions: read                 # to download the previous saved build

# One build at a time, the newest push waiting behind it. A build from scratch has a group of its
# own, so that a push cannot displace it while it waits; when it finishes, its saved build is the
# newest and the next incremental build starts from it.
concurrency:
  group: main-state-${{ (github.event_name == 'schedule' || inputs.full) && 'full' || 'incremental' }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120        # a build from scratch takes just under an hour (it was 56 minutes on 23 November)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the previous saved build must be for an ancestor of this commit
          persist-credentials: false
      - name: Lint
        run: scripts/lint.sh
      - name: Install Lean
        run: |
          curl -sSfL --retry 3 https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o "$RUNNER_TEMP/elan-init.sh"
          sh "$RUNNER_TEMP/elan-init.sh" -y --default-toolchain none
          echo "$HOME/.elan/bin" >>"$GITHUB_PATH"
          "$HOME/.elan/bin/lake" --version
      - name: Fetch the dependencies and Mathlib's build
        run: lake exe cache get || { sleep 20; lake exe cache get; }
      - name: Start from the previous saved build of main
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.full)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          prev="$RUNNER_TEMP/previous"
          python3 scripts/ci/base_state.py --work . --base "$GITHUB_SHA" --out "$prev" ||
            { echo "could not fetch a saved build; building from scratch"; rm -rf .lake/build; exit 0; }
          [ -d .lake/build ] || exit 0
          from=$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1])).get("sha", ""))' "$prev/meta.json")
          if ! git diff --quiet "$from" "$GITHUB_SHA" -- lean-toolchain lake-manifest.json lakefile.toml lakefile.lean; then
            echo "the toolchain, the dependencies or the build options changed since $from: building from scratch"
            rm -rf .lake/build
            exit 0
          fi
          python3 scripts/ci/prune_build.py
          echo "FROM_SHA=$from" >>"$GITHUB_ENV"
      - name: Build
        # The main library and the comparator files. RiemannMasulloClassField, the fourth default
        # target, needs the class field theory dependency; the Full build workflow builds it.
        run: lake build RiemannMasullo Challenge Main
      - name: Signatures, and no sorry inside definitions
        run: |
          mkdir main-state
          scripts/signatures.sh --all >main-state/signatures.txt
          scripts/signatures.sh --sorry-in-defs main-state/signatures.txt
      - name: The list of command keywords is up to date
        run: scripts/ci/keywords.sh --check
      - name: Pack the build
        run: |
          tar -C .lake -I 'zstd -T0 -6' -cf main-state/build.tar.zst build
          printf '{"sha": "%s", "from": "%s"}\n' "$GITHUB_SHA" "${FROM_SHA:-}" >main-state/meta.json
          ls -l main-state
          echo "saved the build of ${GITHUB_SHA:0:12}${FROM_SHA:+, built on top of the saved build of ${FROM_SHA:0:12}}" >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: main-state
          path: main-state
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
